name: AIIP-auth

x-service: &service
  build: .
  image: aiip-auth:latest
  environment:
    SERVICE__BIND_HOST: 0.0.0.0
  volumes:
    - ./config.toml:/app/config.toml:ro
    - ./keys:/app/keys:ro
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrate:
    <<: *service
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  auth:
    <<: *service
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; from src.config import cfg; urllib.request.urlopen(f'http://127.0.0.1:{cfg.service.port}/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
    name: aiip
    external: true
