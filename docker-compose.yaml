name: aiip-auth

services:
  auth:
    image: aiip-auth:latest
    restart: unless-stopped
    environment:
      SERVICE__BIND_HOST: 0.0.0.0
      SERVICE__PORT: 8001
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./keys/private.pem:/app/keys/private.pem:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.auth.rule: PathPrefix(`/api/auth`)
      traefik.http.routers.auth.middlewares: auth-ratelimit
      traefik.http.middlewares.auth-ratelimit.ratelimit.average: "10"
      traefik.http.middlewares.auth-ratelimit.ratelimit.burst: "10"
      traefik.http.middlewares.auth-ratelimit.ratelimit.period: 1s
      traefik.http.services.auth.loadbalancer.server.port: "8001"
      docker-rollout.pre-stop-hook: touch /tmp/drain && sleep 6
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; assert not os.path.exists('/tmp/drain'); urllib.request.urlopen('http://127.0.0.1:8001/ready')"]
      interval: 2s
      timeout: 2s
      retries: 1
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: aiip
    external: true
