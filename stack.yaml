services:
  auth:
    image: aiip-auth:${IMAGE_TAG:?}
    labels:
      com.docker.compose.project: aiip-auth
      com.docker.compose.service: auth
    environment:
      SERVICE__BIND_HOST: 0.0.0.0
    configs:
      - source: config
        target: /app/config.toml
    secrets:
      - source: private_key
        target: /app/keys/private.pem
        uid: "1000"
        gid: "1000"
        mode: 0400
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import tomllib, urllib.request; port = tomllib.load(open('config.toml', 'rb'))['service']['port']; urllib.request.urlopen(f'http://127.0.0.1:{port}/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      replicas: ${REPLICAS:?}
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 0
        order: start-first
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

configs:
  config:
    name: aiip-auth-config-${CONFIG_HASH:?}
    file: ./config.toml

secrets:
  private_key:
    name: aiip-auth-key-${KEY_HASH:?}
    file: ./keys/private.pem

networks:
  default:
    name: aiip
    external: true
