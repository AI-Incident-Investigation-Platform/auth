apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  namespace: apps
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: aiip-auth:latest
          command: ["alembic", "upgrade", "head"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secret
              mountPath: /app/config.toml
              subPath: config.toml
      volumes:
        - name: secret
          secret:
            secretName: auth
